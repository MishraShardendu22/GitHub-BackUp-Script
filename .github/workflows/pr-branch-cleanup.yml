# ==============================================================================
# GitHub Actions — Automatic Remote Feature Branch Cleanup on PR Merge
# ==============================================================================
name: "PR Post-Merge Remote Branch Cleanup"

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-merged-branch:
    name: "Delete Merged Remote Branch"
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'master'
    runs-on: ubuntu-latest
    steps:
      - name: "Delete Remote Feature Branch"
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headRef = context.payload.pull_request.head.ref;
            core.info(`Processing post-merge cleanup for branch: ${headRef}`);
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${headRef}`
              });
              core.info(`Successfully deleted merged remote branch: ${headRef}`);
            } catch (error) {
              if (error.status === 422 || error.status === 404) {
                core.info(`Remote branch ${headRef} was already deleted or not found.`);
              } else {
                core.setFailed(`Failed to delete remote branch ${headRef}: ${error.message}`);
              }
            }
