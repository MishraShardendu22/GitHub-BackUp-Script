name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Go Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Build Go Binaries
        run: go build -v ./...

  observatory-test:
    name: Python Observatory Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-observatory
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Run Observatory Unit Tests
        env:
          GO_BACKEND_URL: http://localhost:8080
          OPENROUTER_API_KEY: ci-test-key
          INTERNAL_SECRET: ci-internal-secret
          JWT_SECRET: ci-jwt-secret
        run: uv run python test_observability.py

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Linter
        run: pnpm run lint

      - name: Run Next.js Build
        run: pnpm run build
