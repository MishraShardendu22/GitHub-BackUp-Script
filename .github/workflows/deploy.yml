name: Continuous Deployment & Image Publishing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 1. Full Pre-Deployment Validation Gate
  # ----------------------------------------------------------------------------
  validate:
    name: Pre-Deployment Validation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true


      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Run Python Observatory Tests
        working-directory: agentic-observatory
        env:
          GO_BACKEND_URL: ${{ vars.GO_BACKEND_URL || 'http://localhost:8080' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'ci-mock-pool-key-a,ci-mock-pool-key-b' }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET || 'ci-mock-internal-secret-min-32-chars' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-mock-jwt-secret-min-32-chars-key' }}
        run: |
          uv sync
          uv run --with pyright pyright
          uv run python test_observability.py
          uv run python test_openrouter_keys.py
          uv run python test_agent_template.py
          uv run python test_agent_suite.py

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Run Frontend Tests & Turbopack Build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run build

  # ----------------------------------------------------------------------------
  # 2. Build & Push Docker Images to Docker Hub
  # ----------------------------------------------------------------------------
  publish-docker-images:
    name: Build & Push Images to Docker Hub
    needs: [ validate ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Extract Docker Metadata (Worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-worker
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and Push Backup Worker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backup-worker/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Extract Docker Metadata (Observatory)
        id: meta-observatory
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-observatory
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Python Observatory Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agentic-observatory/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta-observatory.outputs.tags }}
          labels: ${{ steps.meta-observatory.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Extract Docker Metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  # ----------------------------------------------------------------------------
  # 3. Deploy Go Backend on Render
  # ----------------------------------------------------------------------------
  deploy-render:
    name: Deploy Go Backend on Render
    needs: [ publish-docker-images ]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment webhook..."
          curl -f -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Render deployment triggered successfully."

  # ----------------------------------------------------------------------------
  # 4. Trigger / Verify Vercel Deployments (Frontend & Observatory)
  # ----------------------------------------------------------------------------
  deploy-vercel:
    name: Deploy Frontend to Vercel Production
    needs: [ validate ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          cd frontend
          vercel pull --yes --environment=production --token=${VERCEL_TOKEN}
          vercel build --prod --token=${VERCEL_TOKEN}
          vercel deploy --prebuilt --prod --token=${VERCEL_TOKEN}

  # ----------------------------------------------------------------------------
  # 5. Continuous Deployment Summary & Health Telemetry
  # ----------------------------------------------------------------------------
  deployment-summary:
    name: Deployment Summary
    needs: [ publish-docker-images, deploy-render, deploy-vercel ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary Report
        run: |
          echo "### 🚀 Automated Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Target Platform | Deployment Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Go Backend** | Render Container | \`${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-backend:latest\` | ${{ needs.deploy-render.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backup Worker** | Container Registry | \`${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-worker:latest\` | ${{ needs.publish-docker-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Dashboard** | Vercel Edge / Container | \`${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-frontend:latest\` | ${{ needs.deploy-vercel.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Python Observatory** | Vercel / Container | \`${{ secrets.DOCKERHUB_USERNAME || 'mishrashardendu22' }}/github-backup-observatory:latest\` | ${{ needs.publish-docker-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit SHA: \`${{ github.sha }}\` | Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
