name: "🚀 Feature Request & Architecture Proposal"
description: "Propose a new capability, connector, endpoint, or architecture improvement"
title: "feat(<subsystem>): [Concise feature proposal]"
labels: ["type/feat"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new feature, storage connector, MCP integration, or architectural enhancement for the GitHub Backup Automation System.

  - type: dropdown
    id: subsystem
    attributes:
      label: "Target Subsystem"
      description: "Select which component this feature extends"
      options:
        - "Backend (Go Fiber REST API / WebSocket Hub)"
        - "Python Observatory (FastAPI / LangChain Agent / pgvector)"
        - "Frontend (Next.js 16 App Router / Tailwind CSS)"
        - "Backup Worker CLI (Go SQLite Engine)"
        - "SaaS Connectors & Pluggable Storage (S3 / R2 / GDrive)"
        - "Native Model Context Protocol (MCP) Server"
        - "CI/CD & DevOps Automation"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement / User Story"
      description: "What problem does this feature solve? Who is affected?"
      placeholder: "As a developer/admin, I need to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Architecture & Solution"
      description: "Describe how you envision this feature being implemented."
      placeholder: "Technical implementation details, new API routes, database schemas, or agent tools..."
    validations:
      required: true

  - type: checkboxes
    id: considerations
    attributes:
      label: "Design Considerations"
      options:
        - label: "Zero-Containerization Boundary respected (Vercel & Render serverless runtimes)"
        - label: "Backward compatibility preserved for existing database migrations"
        - label: "Agent skills (`.agents/skills/`) and architectural documentation will be updated"
