name: "🐛 Bug Report"
description: "Report a reproducible defect, error, or unexpected behavior"
title: "fix(<subsystem>): [Concise bug summary]"
labels: ["type/fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide sufficient detail so we can diagnose and resolve it quickly.

  - type: dropdown
    id: subsystem
    attributes:
      label: "Impacted Subsystem"
      description: "Select the primary service or component where the issue occurs"
      options:
        - "Backend (Go Fiber REST API / WebSocket Hub)"
        - "Python Observatory (FastAPI / LangChain Agent / pgvector)"
        - "Frontend (Next.js 16 App Router / Tailwind CSS)"
        - "Backup Worker CLI (Go SQLite Engine)"
        - "Database & Migrations (Neon PostgreSQL / pgvector)"
        - "CI/CD & Deployment Automation"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe what went wrong and how it deviated from expected behavior..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the behavior."
      placeholder: |
        1. Start service with '...'
        2. Execute API call / tool action '...'
        3. See error response / panic in logs '...'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment & Runtime Details"
      description: "Provide details on the operating system, Go/Python version, and deployment environment."
      value: |
        - **OS**: Linux / macOS / Windows
        - **Go Version**: `go version`
        - **Python Version**: `python --version`
        - **Node/pnpm Version**: `node -v` / `pnpm -v`
        - **Deployment**: Local / Vercel / Render / Docker
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Stack Traces"
      description: "Paste any relevant terminal or container logs here."
      render: shell
    validations:
      required: false
